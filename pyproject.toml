[project]
name = "ptrade-order-tool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pypinyin>=0.51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pyinstaller>=6.0",
]

[project.scripts]
ptrade-order-tool = "ptrade_order_tool.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
